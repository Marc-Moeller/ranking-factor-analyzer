services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ranklens}
      POSTGRES_DB: ${POSTGRES_DB:-ranklens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ranklens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    # Binds to localhost only. Change to "4711:4711" to expose it, but read the
    # auth note in the README first: an empty RANKLENS_API_KEY leaves every write
    # endpoint open to whoever can reach the port.
    ports:
      - "127.0.0.1:4711:4711"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ranklens}
      POSTGRES_DB: ${POSTGRES_DB:-ranklens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
