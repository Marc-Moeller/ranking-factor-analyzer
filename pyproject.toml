[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ranklens"
version = "0.1.0"
description = "RankLens — a Cora replacement: SERP-driven on-page correlation analysis + before/after algorithm-update comparison, with an AI report and a clean UI."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "textstat>=0.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]

[tool.setuptools.packages.find]
include = ["ranklens*"]
